<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Informe de ventas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
            color: #16324f;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #cccccc;
            text-align: left;
        }
        th {
            background: #eaf2f8;
        }
    </style>
</head>
<body>
    <h1>Informe de ventas por ciudad</h1>
    <p>Datos ficticios para una práctica de CI/CD.</p>
    <p>Registros procesados: 6</p>

    <table>
        <caption>Ventas en bolivianos</caption>
        <thead>
            <tr>
                <th scope="col">Ciudad</th>
                <th scope="col">Ventas (Bs)</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>Cochabamba</td><td>450.00</td></tr><tr><td>La Paz</td><td>1200.00</td></tr><tr><td>Santa Cruz</td><td>400.00</td></tr>
        </tbody>
    </table>

    <h2>Total: Bs 2050.00</h2>
</body>
</html>
